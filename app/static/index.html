<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi-Cloud Task Manager</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">Docker · Kubernetes · Terraform · GitHub Actions</p>
      <h1>Multi-Cloud Task Manager</h1>
      <p id="runtime" class="runtime">Loading runtime information…</p>
    </header>

    <section class="panel">
      <form id="task-form">
        <label for="title">New task</label>
        <div class="row">
          <input id="title" name="title" maxlength="120" required placeholder="Validate Terraform for AWS, Azure and GCP">
          <button type="submit">Add task</button>
        </div>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="panel">
      <div class="list-heading">
        <h2>Tasks</h2>
        <button id="refresh" class="secondary" type="button">Refresh</button>
      </div>
      <ul id="tasks"></ul>
      <p id="empty" class="empty">No tasks yet.</p>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
