name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Python tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Test
        env:
          STORE_BACKEND: memory
          PYTHONPATH: .
        run: pytest -q

  terraform-tests:
    name: Terraform mock test (${{ matrix.cloud }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, azure, gcp]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ensure CI cannot apply cloud infrastructure
        shell: bash
        run: |
          if grep -RInE 'terraform[[:space:]]+apply' .github/workflows; then
            echo "A forbidden cloud-apply command was found in CI. This project intentionally blocks it."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform -chdir=terraform/${{ matrix.cloud }} fmt -check -recursive

      - name: Initialize without a remote backend
        run: terraform -chdir=terraform/${{ matrix.cloud }} init -backend=false -input=false

      - name: Validate configuration
        run: terraform -chdir=terraform/${{ matrix.cloud }} validate

      - name: Run credential-free mock tests
        run: terraform -chdir=terraform/${{ matrix.cloud }} test -no-color

  kind-integration:
    name: Docker and Kubernetes integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: multicloud-task-api:1.0.0
          build-args: |
            APP_VERSION=1.0.0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: "v1.37.1"

      - name: Install Kind
        shell: bash
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x kind
          sudo install kind /usr/local/bin/kind
          kind version

      - name: Create local Kubernetes cluster
        run: kind create cluster --name multicloud-devops --config kind/cluster.yaml --wait 120s

      - name: Load local image into Kind
        run: kind load docker-image multicloud-task-api:1.0.0 --name multicloud-devops

      - name: Deploy manifests
        run: kubectl apply -k k8s

      - name: Verify deployment and API
        run: ./scripts/verify-local.sh

      - name: Collect diagnostics after failure
        if: failure()
        shell: bash
        run: |
          kubectl get all -n multicloud-devops -o wide || true
          kubectl describe pods -n multicloud-devops || true
          kubectl logs -n multicloud-devops deployment/task-api --all-containers=true --tail=200 || true
          kubectl logs -n multicloud-devops deployment/redis --all-containers=true --tail=200 || true
